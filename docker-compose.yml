services:
  mongo:
    image: mongo:7
    container_name: knowledge-mis-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: knowledge-mis-server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/knowledge_mis_demo
      JWT_SECRET: demo_secret_change_me
      JWT_EXPIRES_IN: 7d
      PORT: 5001
      CLIENT_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      UPLOAD_DIR: /app/uploads
      AUTO_SEED: "true"
    ports:
      - "5001:5001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo

  seed:
    build: ./server
    container_name: knowledge-mis-seed
    environment:
      MONGO_URI: mongodb://mongo:27017/knowledge_mis_demo
      JWT_SECRET: demo_secret_change_me
    command: npm run seed
    depends_on:
      - mongo
    profiles:
      - seed

  client:
    build: ./client
    container_name: knowledge-mis-client
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:5001/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
  uploads:
